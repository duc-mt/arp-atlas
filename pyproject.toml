[project]
name = "network-hunter"
version = "1.0.0"
description = "A local-network ARP scanner using scapy."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mai Tan Duc", email = "ducmai.network@gmail.com" }]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "--cov=main --cov-report=term-missing"
testpaths = ["tests"]
