[project]
name = "arp-atlas"
version = "1.1.0"
description = "A local-network ARP scanner using scapy."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mai Tan Duc", email = "ducmai.network@gmail.com" }]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["F", "E9", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing"
testpaths = ["backend/tests", "cli/tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["backend/app", "cli/arp_atlas_cli"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
