name: 🔄 Update OUI Database

# Refreshes backend/app/data/manuf.gz from Wireshark's manuf file once a month
# and commits the result straight to the default branch - no pull request to
# review. Nothing is committed unless the decompressed database really changed
# AND the full test suite passes against it, so a bad download can't land.
#
# If the default branch is protected (required pull requests or status checks),
# the built-in token cannot push to it: either let github-actions[bot] bypass
# the rule, or add a repository secret named OUI_PUSH_TOKEN holding a token that
# may push (a push made with it also triggers ci.yml, which a push made with the
# built-in token does not).

on:
  schedule:
    # 00:00 UTC on the 1st of every month.
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-oui
  cancel-in-progress: false

env:
  OUI_FILE: backend/app/data/manuf.gz

jobs:
  update:
    name: Refresh manuf.gz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.OUI_PUSH_TOKEN || github.token }}

      - name: Download the latest Wireshark manuf database
        run: scripts/update-manuf-db.sh

      - name: Detect a real change
        id: diff
        run: |
          set -euo pipefail
          # The file is gzip, so compare the decompressed text: a different
          # compressor build must not produce a commit with no change.
          old_lines="$(git show "HEAD:${OUI_FILE}" | gzip -dc | wc -l)"
          new_lines="$(gzip -dc "${OUI_FILE}" | wc -l)"
          old_sum="$(git show "HEAD:${OUI_FILE}" | gzip -dc | sha256sum | cut -d' ' -f1)"
          new_sum="$(gzip -dc "${OUI_FILE}" | sha256sum | cut -d' ' -f1)"
          if [ "${old_sum}" = "${new_sum}" ]; then
            git checkout -- "${OUI_FILE}"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "The OUI database is already up to date (${new_lines} lines)." | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "changed=true"
              echo "old_lines=${old_lines}"
              echo "new_lines=${new_lines}"
            } >> "${GITHUB_OUTPUT}"
            echo "The OUI database changed: ${old_lines} -> ${new_lines} lines." | tee -a "${GITHUB_STEP_SUMMARY}"
          fi

      - uses: actions/setup-python@v5
        if: steps.diff.outputs.changed == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.diff.outputs.changed == 'true'
        run: pip install -r requirements-dev.txt

      # The gate: a database that breaks the vendor lookup must not be committed.
      - name: Test against the new database
        if: steps.diff.outputs.changed == 'true'
        run: pytest backend/tests cli/tests --no-cov -q

      - name: Commit and push to the default branch
        if: steps.diff.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OLD_LINES: ${{ steps.diff.outputs.old_lines }}
          NEW_LINES: ${{ steps.diff.outputs.new_lines }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${OUI_FILE}"
          git commit -m "chore(data): refresh OUI database from Wireshark manuf (${OLD_LINES} -> ${NEW_LINES} lines)"

          # Someone may have pushed since the checkout; only this file is ours,
          # so replaying the commit on top of the newest tip is safe. A few
          # attempts cover a push racing with ours.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${DEFAULT_BRANCH}"; then
              echo "Committed the refreshed database to ${DEFAULT_BRANCH} (${OLD_LINES} -> ${NEW_LINES} lines)." | tee -a "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto the latest ${DEFAULT_BRANCH}." >&2
            git fetch origin "${DEFAULT_BRANCH}"
            git rebase "origin/${DEFAULT_BRANCH}"
          done
          echo "Could not push after 3 attempts - see the log above." >&2
          exit 1
