[project]
name = "arp-atlas-cli"
version = "1.1.0"
description = "Command-line interface for ARP Atlas"
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.7.0",
    "rich>=14.0",
]

[project.scripts]
arp-atlas = "cli.arp_atlas_cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arp_atlas_cli*"]
